<!DOCTYPE html>
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/icon.svg" >
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" >
    <link rel="manifest" href="/manifest.webmanifest" >
    <meta name="theme-color" content="#0f0d0c" >
    <meta name="apple-mobile-web-app-capable" content="yes" >
    <meta name="apple-mobile-web-app-title" content="Smart Code" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <!-- Monaco (the editor) and Pyodide load from jsDelivr: connecting early shows the editor sooner, most on phones -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin >
    <link rel="preconnect" href="https://fonts.googleapis.com" >
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin >
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" >
    <title>Smart Code Editor</title>
    <meta name="description" content="محرر أكواد يكتشف الأخطاء في 21 لغة برمجة ويشرح حلها بالعربية والإنجليزية باستخدام الذكاء الاصطناعي.">
    <link rel="canonical" href="https://smartcode-editor.vercel.app/">

    <!-- Open Graph: link previews in WhatsApp, LinkedIn, Facebook, Slack -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Smart Code Editor">
    <meta property="og:title" content="Smart Code Editor — محرر الأكواد الذكي">
    <meta property="og:description" content="محرر أكواد يكتشف الأخطاء في 21 لغة برمجة ويشرح حلها بالعربية والإنجليزية باستخدام الذكاء الاصطناعي.">
    <meta property="og:url" content="https://smartcode-editor.vercel.app/">
    <meta property="og:image" content="https://smartcode-editor.vercel.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="محرر الأكواد الذكي: محرر كود مع فحص بالذكاء الاصطناعي">
    <meta property="og:locale" content="ar_SA">
    <meta property="og:locale:alternate" content="en_US">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Smart Code Editor — محرر الأكواد الذكي">
    <meta name="twitter:description" content="محرر أكواد يكتشف الأخطاء في 21 لغة برمجة ويشرح حلها بالعربية والإنجليزية باستخدام الذكاء الاصطناعي.">
    <meta name="twitter:image" content="https://smartcode-editor.vercel.app/og-image.png">
    <meta name="twitter:image:alt" content="محرر الأكواد الذكي: محرر كود مع فحص بالذكاء الاصطناعي">
  </head>
  <body>
    <!-- Shown until React mounts (createRoot replaces it): continues the phone's launch screen with the same colour, icon and name -->
    <div id="root">
      <div class="boot" aria-hidden="true">
        <img src="/icon.svg" width="88" height="88" alt="">
        <span>Smart Code Editor</span>
      </div>
      <style>
        .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #0f0d0c; color: #f4f1ed; font: 500 18px/1.2 Inter, system-ui, sans-serif; letter-spacing: .01em }
        .boot img { border-radius: 22px; box-shadow: 0 12px 40px -8px rgb(255 77 20 / .45); animation: boot-pulse 1.6s ease-in-out infinite }
        .boot span { opacity: .85 }
        @keyframes boot-pulse { 50% { transform: scale(.94); box-shadow: 0 6px 24px -8px rgb(255 77 20 / .3) } }
        @media (prefers-reduced-motion: reduce) { .boot img { animation: none } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
